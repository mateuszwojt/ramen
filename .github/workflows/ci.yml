name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            qt6-base-dev libqt6opengl6-dev libgl1-mesa-dev libglew-dev \
            libboost-all-dev libtbb-dev libyaml-cpp-dev \
            libimath-dev libopenexr-dev libopenimageio-dev libopencolorio-dev \
            libagg-dev libjpeg-dev libpng-dev libtiff-dev zlib1g-dev \
            libgtest-dev libgmock-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja qt boost tbb yaml-cpp imath openexr openimageio \
            opencolorio libagg glew googletest sse2neon

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release
